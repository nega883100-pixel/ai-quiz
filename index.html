      </div>
      <div class="title-plaque panel">

        <h1 id="title" class="pix-lg">企業 AI 能力大冒險</h1>
        <p id="subtitle" class="subtitle pix">了解你的企業AI成熟度</p>
        <p id="tagline" class="tagline pix" hidden></p>
      </div>
      <div class="start-cta">
        <button type="button" class="btn-start" id="btn-start-full">
          <span class="en" id="btn-start-full-en">FULL QUEST</span>
          <span class="zh" id="btn-start-full-zh">完整挑戰 15題・約2分鐘</span>
        </button>
        <button type="button" class="btn-start btn-start-secondary" id="btn-start-quick">
          <span class="en" id="btn-start-quick-en">QUICK RUN</span>
          <span class="zh" id="btn-start-quick-zh">快速闖關 5題・30秒</span>
        </button>
        <p class="start-hint pix" id="start-hint">免填個資・答完立即揭曉你的AI冒險稱號</p>
      </div>
    </section>

    <section id="view-question" class="view" hidden>
      <div class="sheet panel">
        <div class="q-top">
          <div class="stage-chip" id="progress-label">STAGE 1/17</div>
          <div class="mode-tag" id="mode-tag">完整挑戰</div>
          <div class="progress" id="progress" aria-hidden="true"></div>
        </div>
        <div class="dim-row">
          <div class="dim-name" id="dim-name">構面</div>
          <div class="multi-badge" id="multi-badge" hidden></div>
        </div>
        <h2 class="prompt" id="prompt"></h2>
        <div class="options" id="options"></div>
        <div class="q-foot">
          <button type="button" class="btn-ghost btn-nav" id="btn-prev" disabled>◀ 上一題</button>
          <button type="button" class="btn-ghost" id="btn-restart">重新開始</button>
          <button type="button" class="btn-ghost btn-nav" id="btn-next" disabled>下一題 ▶</button>
        </div>
      </div>
    </section>

    <section id="view-result" class="view" hidden>
      <div class="sheet panel">
        <div class="res-top">
          <div>
            <div class="mission" id="mission">MISSION CLEAR</div>
            <div class="title-block">
              <h2 class="honor" id="honor">你的稱號：</h2>
              <div class="official" id="official"></div>
              <div class="flavor pix" id="flavor"></div>
            </div>
          </div>
          <div class="res-actions">
            <button type="button" class="btn-again" id="btn-again">再測一次</button>
            <span class="idle-hint" id="idle-hint"></span>
          </div>
        </div>
        <div class="res-body">
          <div class="res-left">
            <div class="portrait-frame">
              <img id="portrait" src="assets/img/portrait_unknowing.png" alt="">
              <div class="portrait-caption" id="portrait-caption"></div>
            </div>
          </div>
          <div class="res-right">
            <p class="desc" id="desc"></p>
            <div class="national" id="national"></div>
            <div class="bars" id="bars"></div>
            <div class="weak-box" id="weak-box"></div>
            <div class="recommend">
              <div class="lab" id="recommend-lab">下一步建議</div>
              <p id="recommend-text"></p>
            </div>
          </div>
        </div>
        <div class="qr-box">
          <img id="qr-img" src="assets/img/qr_placeholder.png" alt="輔導諮詢 QR 碼預留位置" width="168" height="168">
          <div class="qr-text">
            <div id="qr-label">掃碼預約輔導諮詢</div>
            <small id="qr-note">北區輔導中心將主動了解您的需求</small>
          </div>
        </div>
        <div class="footnote" id="footnote" hidden></div>
      </div>
    </section>
  </div>
